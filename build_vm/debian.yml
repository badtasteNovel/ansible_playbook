---
# 這支 playbook 完全不透過 vSphere/ESXi API（不裝 pyvmomi、不用 community.vmware），
# 只靠純 SSH + scp + ESXi 自己的本地 CLI 工具（vmkfstools）：
#   1. 產生兩組 SSH 金鑰：client 端（charlie 登入用）跟 VM 自己的 host key
#      （host key 預先產生、透過 ISO 塞進去蓋掉 openssh-server 開機時自動生成的那組，
#      這樣 fingerprint 在裝機前就已經知道，不用等 VM 開機、SSH 起來才去 scan）
#   2. 渲染 preseed.cfg、重新封裝 ISO（跟之前一樣，remaster-iso.sh 完全沒變邏輯）
#   3. 渲染 .vmx
#   4. SSH 進 hypervisor：建資料夾、scp 傳 ISO、scp 傳 .vmx、用 vmkfstools 建虛擬磁碟
#
# 到這裡自動化就結束——VM 的「註冊」（register）跟「開機」刻意留給人工在 Host Client
# 網頁介面上做，自動化程式碼完全不碰 ESXi 的管理層（inventory）。
#
# 注意：.vmx 檔案格式、vmkfstools 語法是依 VMware 官方文件的一般知識寫的，
# 沒有真實 ESXi 環境測過，實際跑之前請注意。

- name: 產生 Debian VM 所需的所有檔案，上傳到 hypervisor 的 datastore
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vm_name: debian-vm
    vm_user: charlie
    vm_cpus: 2
    vm_memory_mb: 2048
    vm_disk_gb: 20

    ssh_key_dir: "{{ playbook_dir }}/../custom/keys"
    ssh_key_path: "{{ ssh_key_dir }}/{{ vm_user }}_ed25519" # VM 上 charlie 登入用的 client 金鑰
    ssh_host_key_path: "{{ ssh_key_dir }}/{{ vm_name }}_host_ed25519" # VM 自己的 host key
    hypervisor_known_hosts_path: "{{ ssh_key_dir }}/hypervisor_known_hosts"
    known_hosts_path: "{{ ssh_key_dir }}/known_hosts" # 之後手動把 VM 的 IP 補進這個檔案

    generated_dir: "{{ playbook_dir }}/../custom/generated"
    preseed_output_dir: "{{ generated_dir }}/preseed/{{ vm_name }}" # 存放要塞進 ISO 的所有檔案（preseed.cfg + host key）
    iso_output_dir: "{{ generated_dir }}/iso/{{ vm_name }}"
    preseed_output_iso: "{{ iso_output_dir }}/{{ vm_name }}-preseed.iso"
    vmx_output_path: "{{ iso_output_dir }}/{{ vm_name }}.vmx"

    datastore_vm_dir: "/vmfs/volumes/{{ hypervisor_datastore }}/{{ vm_name }}"
    datastore_iso_path: "{{ datastore_vm_dir }}/{{ vm_name }}-preseed.iso"
    datastore_vmx_path: "{{ datastore_vm_dir }}/{{ vm_name }}.vmx"
    datastore_vmdk_path: "{{ datastore_vm_dir }}/{{ vm_name }}.vmdk"

    hypervisor_hostname: "{{ lookup('env', 'HYPERVISOR_HOSTNAME') }}"
    hypervisor_username: "{{ lookup('env', 'HYPERVISOR_USERNAME') }}"
    hypervisor_password: "{{ lookup('env', 'HYPERVISOR_PASSWORD') }}"
    hypervisor_datastore: "{{ lookup('env', 'HYPERVISOR_DATASTORE') }}"
    hypervisor_network: "{{ lookup('env', 'HYPERVISOR_NETWORK') }}"

    ssh_opts: >-
      -o StrictHostKeyChecking=accept-new
      -o UserKnownHostsFile={{ hypervisor_known_hosts_path }}

  tasks:
    - name: 確認必要變數都有值
      ansible.builtin.assert:
        that:
          - iso_path is defined
          - hypervisor_hostname | length > 0
          - hypervisor_username | length > 0
          - hypervisor_password | length > 0
          - hypervisor_datastore | length > 0
          - hypervisor_network | length > 0
        fail_msg: >-
          請確認 custom/.env 已填好必要連線資訊，且透過 --extra-vars 傳入
          iso_path（task select-iso 的輸出路徑）

    - name: 確保 custom/keys/、custom/generated/preseed/、custom/generated/iso/ 目錄存在
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ ssh_key_dir }}"
        - "{{ preseed_output_dir }}"
        - "{{ iso_output_dir }}"

    - name: 產生 SSH 金鑰對（charlie 登入用，若已存在則不重建）
      community.crypto.openssh_keypair:
        path: "{{ ssh_key_path }}"
        type: ed25519
        comment: "{{ vm_user }}@{{ vm_name }}"

    - name: 讀取 client 公鑰內容
      ansible.builtin.slurp:
        src: "{{ ssh_key_path }}.pub"
      register: ssh_public_key_raw

    - name: 產生 VM 自己的 SSH host key（若已存在則不重建）
      community.crypto.openssh_keypair:
        path: "{{ ssh_host_key_path }}"
        type: ed25519
        comment: "{{ vm_name }}"

    - name: 讀取 host key 公鑰內容（之後印出來給使用者填 known_hosts 用）
      ansible.builtin.slurp:
        src: "{{ ssh_host_key_path }}.pub"
      register: ssh_host_public_key_raw

    - name: 把 host key 複製進 ISO 注入資料夾（用複製檔案，不把金鑰內容塞進 late_command 字串）
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ preseed_output_dir }}/{{ item.dest }}"
        remote_src: true
        mode: "{{ item.mode }}"
      loop:
        - { src: "{{ ssh_host_key_path }}", dest: ssh_host_key, mode: "0600" }
        - { src: "{{ ssh_host_key_path }}.pub", dest: ssh_host_key.pub, mode: "0644" }

    - name: 渲染 preseed.cfg
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/debian_preseed_iso/templates/preseed.cfg.j2"
        dest: "{{ preseed_output_dir }}/preseed.cfg"
        mode: "0600"
      vars:
        vm_hostname: "{{ vm_name }}"
        ssh_public_key: "{{ (ssh_public_key_raw.content | b64decode).strip() }}"

    - name: 重新封裝 ISO，塞入 preseed.cfg、host key 並改開機參數
      ansible.builtin.command:
        cmd: >
          {{ playbook_dir }}/../custom/scripts/remaster-iso/debian.sh
          {{ iso_path }}
          {{ preseed_output_dir }}
          {{ preseed_output_iso }}
      args:
        creates: "{{ preseed_output_iso }}"

    - name: 渲染 .vmx
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/debian_preseed_iso/templates/debian.vmx.j2"
        dest: "{{ vmx_output_path }}"
        mode: "0600"

    - name: 確保 hypervisor datastore 上的 VM 資料夾存在
      ansible.builtin.command:
        cmd: >
          sshpass -e ssh {{ ssh_opts }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}
          mkdir -p {{ datastore_vm_dir }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: 把重新封裝好的 ISO 上傳到 datastore
      ansible.builtin.command:
        cmd: >
          sshpass -e scp {{ ssh_opts }}
          {{ preseed_output_iso }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}:{{ datastore_iso_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: 把 .vmx 上傳到 datastore
      ansible.builtin.command:
        cmd: >
          sshpass -e scp {{ ssh_opts }}
          {{ vmx_output_path }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}:{{ datastore_vmx_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: 用 vmkfstools 建立虛擬磁碟
      ansible.builtin.command:
        cmd: >
          sshpass -e ssh {{ ssh_opts }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}
          vmkfstools -c {{ vm_disk_gb }}G -d thin {{ datastore_vmdk_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: 印出後續手動步驟需要的資訊
      ansible.builtin.debug:
        msg:
          - "VM 相關檔案都已經上傳完成，接下來要手動做："
          - "1. 登入 Host Client，瀏覽 datastore 到 {{ datastore_vmx_path }}，Register VM"
          - "2. 手動 Power On"
          - "3. 開機、preseed 無人值守安裝跑完後，自己查一下 VM 的 IP"
          - "4. 把下面這行加上 IP 貼到 {{ known_hosts_path }}（host key 是我們自己產生的，已知道內容，不用再掃描）："
          - "<VM 的 IP> {{ (ssh_host_public_key_raw.content | b64decode).strip() }}"
          - "使用者：{{ vm_user }}"
          - "私鑰：{{ ssh_key_path }}"
