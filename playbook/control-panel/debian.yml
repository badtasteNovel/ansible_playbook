---
# 這支 playbook 完全不透過 vSphere/ESXi API（不裝 pyvmomi、不用 community.vmware），
# 只靠純 SSH + scp + ESXi 自己的本地 CLI 工具（vmkfstools）：
#   1. 產生兩組 SSH 金鑰：client 端（charlie 登入用）跟 VM 自己的 host key
#      （host key 預先產生、透過 ISO 塞進去蓋掉 openssh-server 開機時自動生成的那組，
#      這樣 fingerprint 在裝機前就已經知道，不用等 VM 開機、SSH 起來才去 scan）
#   2. 產生 VM 自己的 WireGuard 金鑰，這台 VM 一定會被設成 WireGuard server
#      （這也是它被叫做 control-panel 的原因）——不是選用功能。另外視 peer_slot_count
#      新增對應數量的「匿名」peer 位置（還沒被任何機器認領，只是先把金鑰/IP 產生好）
#      ——實際由哪台機器拿去用，是 playbook/wsl/add-peer.yml 用 glob 認領的事，
#      這裡完全不管。接著掃描 custom/generated/keys/wireguard-keys/wireguard_peers/
#      底下目前已經存在的每一個 peer（不管是這次新增的還是之前就有的），各自讀出
#      自己的公鑰/PresharedKey/IP，動態組出 wg0.conf 的 [Peer] 區塊
#   3. 渲染 preseed.cfg、重新封裝 ISO（跟之前一樣，remaster-iso.sh 完全沒變邏輯）
#   4. 渲染 .vmx
#   5. SSH 進 hypervisor：建資料夾、scp 傳 ISO、scp 傳 .vmx、用 vmkfstools 建兩顆虛擬磁碟
#      （系統碟 + 資料碟，資料碟 preseed 裝機時會自動格式化、掛載到 vm_data_mount_path）
#
# 到這裡自動化就結束——VM 的「註冊」（register）跟「開機」刻意留給人工在 Host Client
# 網頁介面上做，自動化程式碼完全不碰 ESXi 的管理層（inventory）。
#
# 注意：.vmx 檔案格式、vmkfstools 語法是依 VMware 官方文件的一般知識寫的，
# 沒有真實 ESXi 環境測過，實際跑之前請注意。

- name: 產生 Debian VM 所需的所有檔案，上傳到 hypervisor 的 datastore
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # 沒有 vm_name 的預設值——這是「這次要建的 VM 叫什麼」這種每次 build 的
    # 輸入參數，不是 ISO/OS 等級的靜態設定，所以不放在 manifest.json 裡，
    # 也不在這裡寫死。custom/scripts/tasks/build-vm.yaml 用
    # custom/scripts/vm-form/debian/main.go（用 huh 寫的互動表單，go run
    # 現場跑）現場問使用者，再用 --extra-vars 傳進來。刻意不放預設值：
    # 之前到處各自寫死 "debian-vm" 字串（這裡、Taskfile、
    # playbook/wsl/add-peer.yml、roles/wireguard_keys/tasks/vm_key.yml……），
    # 哪天要加第二台 VM、只改掉其中幾個地方，就會悄悄兜不起來——還真的抓到
    # 好幾處漏改的。
    vm_user: charlie
    vm_cpus: 2
    vm_memory_mb: 2048
    vm_disk_system_gb: 30 # 系統碟：/、swap、/home 用 partman 的 home 配方切，不用動
    vm_disk_data_gb: 10 # 第二顆資料碟：preseed 裝機時格式化成 ext4、掛載到 vm_data_mount_path，拿來存檔案/測試用
    vm_data_mount_path: "/data"
    vm_ssh_port: 52222 # 不用預設 22，躲開公開掃描，也避開跟其他服務（例如之後可能裝的 Kubernetes/Cilium）的 port 衝突

    wireguard_vm_address: "10.105.0.1"
    wireguard_peer_subnet: "10.105.0.0/24" # charlie 的 authorized_keys 用這個限制 from=，只接受從任一合法 WireGuard peer 連進來
    wireguard_listen_port: 51820
    peer_slot_count: 0 # 要新增幾個匿名 peer 位置，由 build:debian 的 gum input 透過 --extra-vars 決定

    keys_dir: "{{ playbook_dir }}/../../custom/generated/keys"
    wireguard_keys_base_dir: "{{ keys_dir }}/wireguard-keys" # custom/generated/keys/ 底下按用途分的子資料夾之一
    wireguard_peers_dir: "{{ wireguard_keys_base_dir }}/wireguard_peers" # 每個 peer 一個子目錄，見 roles/wireguard_keys/tasks/generate_one_peer_slot.yml、claim_peer.yml
    ssh_key_path: "{{ keys_dir }}/ssh/{{ vm_user }}_ed25519" # VM 上 charlie 登入用的 client 金鑰
    ssh_host_key_path: "{{ keys_dir }}/known-hosts/{{ vm_name }}/ed_25519" # VM 自己的 host key——放在 known-hosts/ 底下，因為這把金鑰的用途就是 known_hosts 驗證
    hypervisor_known_hosts_path: "{{ keys_dir }}/known-hosts/hypervisor_known_hosts"
    # 沒有 known_hosts_path 這個變數——這支 playbook 只負責產生原始金鑰材料，
    # 不組「可以直接拿來連線用」的 known_hosts 檔案，那是 SSH client 端的設定，
    # 歸 playbook/wsl/add-peer.yml 管（見該檔案開頭說明）。

    generated_dir: "{{ playbook_dir }}/../../custom/generated"
    preseed_output_dir: "{{ generated_dir }}/preseed/{{ vm_name }}" # 存放要塞進 ISO 的所有檔案（preseed.cfg + host key）
    iso_output_dir: "{{ generated_dir }}/iso/{{ vm_name }}"
    preseed_output_iso: "{{ iso_output_dir }}/{{ vm_name }}-preseed.iso"
    vmx_output_path: "{{ iso_output_dir }}/{{ vm_name }}.vmx"
    remaster_iso_script: "{{ playbook_dir }}/../../custom/scripts/remaster-iso/debian.sh" # 獨立宣告成變數，以後要換成別的腳本/工具比較方便改

    datastore_vm_dir: "/vmfs/volumes/{{ hypervisor_datastore }}/{{ vm_name }}"
    datastore_iso_path: "{{ datastore_vm_dir }}/{{ vm_name }}-preseed.iso"
    datastore_vmx_path: "{{ datastore_vm_dir }}/{{ vm_name }}.vmx"
    datastore_system_vmdk_path: "{{ datastore_vm_dir }}/{{ vm_name }}.vmdk"
    datastore_data_vmdk_path: "{{ datastore_vm_dir }}/{{ vm_name }}-data.vmdk"

    hypervisor_hostname: "{{ lookup('env', 'HYPERVISOR_HOSTNAME') }}"
    hypervisor_username: "{{ lookup('env', 'HYPERVISOR_USERNAME') }}"
    hypervisor_password: "{{ lookup('env', 'HYPERVISOR_PASSWORD') }}"
    hypervisor_datastore: "{{ lookup('env', 'HYPERVISOR_DATASTORE') }}"
    hypervisor_network: "{{ lookup('env', 'HYPERVISOR_NETWORK') }}"

    ssh_opts: >-
      -o StrictHostKeyChecking=accept-new
      -o UserKnownHostsFile={{ hypervisor_known_hosts_path }}

  tasks:
    - name: 確認必要變數都有值
      ansible.builtin.assert:
        that:
          - vm_name is defined
          - vm_name | length > 0
          - iso_path is defined
          - hypervisor_hostname | length > 0
          - hypervisor_username | length > 0
          - hypervisor_password | length > 0
          - hypervisor_datastore | length > 0
          - hypervisor_network | length > 0
        fail_msg: >-
          請確認 custom/.env 已填好必要連線資訊，且透過 --extra-vars 傳入
          vm_name（custom/scripts/vm-form/debian 問出來的值）跟 iso_path
          （task select-iso 的輸出路徑）——正常透過 task build:debian 跑就
          不用自己管這兩個，Taskfile 會自動帶

    - name: 確保 custom/generated/keys/、custom/generated/preseed/、custom/generated/iso/ 目錄存在
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ keys_dir }}"
        - "{{ keys_dir }}/ssh" # ssh_key_path 的上層目錄
        - "{{ keys_dir }}/known-hosts/{{ vm_name }}" # ssh_host_key_path 的上層目錄
        - "{{ preseed_output_dir }}"
        - "{{ iso_output_dir }}"

    - name: 產生 SSH 金鑰對（charlie 登入用，若已存在則不重建）
      community.crypto.openssh_keypair:
        path: "{{ ssh_key_path }}"
        type: ed25519
        comment: "{{ vm_user }}@{{ vm_name }}"

    - name: 讀取 client 公鑰內容
      ansible.builtin.slurp:
        src: "{{ ssh_key_path }}.pub"
      register: ssh_public_key_raw

    - name: 產生 VM 自己的 SSH host key（若已存在則不重建）
      community.crypto.openssh_keypair:
        path: "{{ ssh_host_key_path }}"
        type: ed25519
        comment: "{{ vm_name }}"

    - name: 把 host key 複製進 ISO 注入資料夾（用複製檔案，不把金鑰內容塞進 late_command 字串）
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ preseed_output_dir }}/{{ item.dest }}"
        remote_src: true
        mode: "{{ item.mode }}"
      loop:
        - { src: "{{ ssh_host_key_path }}", dest: ssh_host_key, mode: "0600" }
        - { src: "{{ ssh_host_key_path }}.pub", dest: ssh_host_key.pub, mode: "0644" }

    - name: 確保 VM 自己的 WireGuard 金鑰已經產生（只有 VM 自己的身分，跟 peer 金鑰完全分開）
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../roles/wireguard_keys/tasks/vm_key.yml"
      vars:
        wireguard_keys_dir: "{{ wireguard_keys_base_dir }}"

    - name: 新增 {{ peer_slot_count }} 個匿名的 WireGuard peer 位置（還沒被任何機器認領，數量由 custom/scripts/tasks/build-vm.yaml 的 gum input 決定）
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/../../roles/wireguard_keys/tasks/generate_one_peer_slot.yml"
      loop: "{{ range(0, peer_slot_count | int) | list }}"
      loop_control:
        label: "第 {{ item + 1 }} 個"
      when: (peer_slot_count | int) > 0

    - name: 讀取 VM 自己的 WireGuard 私鑰
      ansible.builtin.slurp:
        src: "{{ wireguard_keys_base_dir }}/{{ vm_name }}_wireguard"
      register: wireguard_vm_private_key_raw

    - name: 列出目前已經存在的 WireGuard peer 目錄（數量不固定，可能是 0 個）
      ansible.builtin.find:
        paths: "{{ wireguard_peers_dir }}"
        file_type: directory
      register: wireguard_peer_dirs

    - name: 讀出每個 peer 的公鑰／PresharedKey／IP，組成清單（給 wg0.conf.j2 的 Peer 迴圈用）
      ansible.builtin.set_fact:
        wireguard_peers: "{{ wireguard_peers | default([]) + [{
          'name': item.path | basename,
          'public_key': lookup('file', item.path + '/public') | trim,
          'preshared_key': lookup('file', item.path + '/psk') | trim,
          'address': lookup('file', item.path + '/address') | trim,
        }] }}"
      loop: "{{ wireguard_peer_dirs.files }}"
      loop_control:
        label: "{{ item.path | basename }}"

    - name: 渲染 VM 的 wg0.conf，放進 ISO 注入資料夾（Peer 區塊數量跟著 wireguard_peers 走，可能是 0 個）
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/wireguard_control_panel/templates/wg0.conf.j2"
        dest: "{{ preseed_output_dir }}/wg0.conf"
        mode: "0600"
      vars:
        wireguard_private_key: "{{ (wireguard_vm_private_key_raw.content | b64decode).strip() }}"
        # wireguard_peers 不在這裡重新宣告——理由跟之前 enable_wireguard 那次
        # 踩到的坑一樣：task 的 vars: 裡用同名又參照自己會造成無窮遞迴
        # templating。wireguard_peers 這個 fact 本來就看得到（一個 peer 都
        # 沒有時完全不會被 set_fact 設到，是 undefined，不是空字串／false，
        # 所以 wg0.conf.j2 裡用 `wireguard_peers | default([])` 接住就好）。

    - name: 編譯 bootstrap-sudo（charlie SSH 進去後可以自己選擇要不要手動執行的一次性救援腳本，見 custom/scripts/bootstrap-sudo/main.go 開頭說明；go run 不適用——這支要跑在 VM 上，VM 不會有 Go 工具鏈、也不會有這份原始碼，所以這裡要交叉編譯成靜態執行檔，直接塞進 ISO）
      ansible.builtin.command:
        cmd: go build -o {{ preseed_output_dir }}/bootstrap-sudo .
        chdir: "{{ playbook_dir }}/../../custom/scripts/bootstrap-sudo"
      environment:
        CGO_ENABLED: "0" # 靜態連結，VM 上不用依賴任何動態函式庫
        GOOS: linux
        GOARCH: amd64
      changed_when: true

    - name: 渲染 preseed.cfg
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/debian_preseed_iso/templates/preseed.cfg.j2"
        dest: "{{ preseed_output_dir }}/preseed.cfg"
        mode: "0600"
      vars:
        vm_hostname: "{{ vm_name }}"
        ssh_public_key: "{{ (ssh_public_key_raw.content | b64decode).strip() }}"
        ssh_port: "{{ vm_ssh_port }}"

    - name: 重新封裝 ISO，塞入 preseed.cfg、host key 並改開機參數
      ansible.builtin.command:
        cmd: >
          {{ remaster_iso_script }}
          {{ iso_path }}
          {{ preseed_output_dir }}
          {{ preseed_output_iso }}
      args:
        creates: "{{ preseed_output_iso }}"

    - name: 渲染 .vmx
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../roles/debian_preseed_iso/templates/debian.vmx.j2"
        dest: "{{ vmx_output_path }}"
        mode: "0600"

    - name: 確保 hypervisor datastore 上的 VM 資料夾存在
      ansible.builtin.command:
        cmd: >
          sshpass -e ssh {{ ssh_opts }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}
          mkdir -p {{ datastore_vm_dir }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: 把重新封裝好的 ISO 上傳到 datastore
      ansible.builtin.command:
        cmd: >
          sshpass -e scp {{ ssh_opts }}
          {{ preseed_output_iso }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}:{{ datastore_iso_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: 把 .vmx 上傳到 datastore
      ansible.builtin.command:
        cmd: >
          sshpass -e scp {{ ssh_opts }}
          {{ vmx_output_path }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}:{{ datastore_vmx_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: 用 vmkfstools 建立系統碟
      ansible.builtin.command:
        cmd: >
          sshpass -e ssh {{ ssh_opts }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}
          vmkfstools -c {{ vm_disk_system_gb }}G -d thin {{ datastore_system_vmdk_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: 用 vmkfstools 建立資料碟
      ansible.builtin.command:
        cmd: >
          sshpass -e ssh {{ ssh_opts }}
          {{ hypervisor_username }}@{{ hypervisor_hostname }}
          vmkfstools -c {{ vm_disk_data_gb }}G -d thin {{ datastore_data_vmdk_path }}
      environment:
        SSHPASS: "{{ hypervisor_password }}"
      changed_when: true

    - name: 印出後續手動步驟需要的資訊
      ansible.builtin.debug:
        msg:
          - "VM 相關檔案都已經上傳完成，接下來要手動做（這幾步是 ESXi Host Client 專屬操作，換平台要重寫）："
          - "1. 登入 Host Client，瀏覽 datastore 到 {{ datastore_vmx_path }}，Register VM"
          - "2. 手動 Power On"
          - "3. 開機、preseed 無人值守安裝跑完後，自己查一下 VM 的 LAN IP（唯一用途：等一下 task add-peer 要用）"
          - "4. 跑 task add-peer——把目前這台機器加進 WireGuard、接通隧道、順便把 known_hosts 跟 SSH 私鑰準備好（VM 的 LAN IP 就是這時候用）"
          - "5. 接通之後，SSH 連線固定走 WireGuard 位址 {{ wireguard_vm_address }}，不是 VM 的 LAN IP——連線細節看 task add-peer 跑完印出的提示"
