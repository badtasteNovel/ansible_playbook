# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  default:
    desc: "互動式選擇作業系統，建立對應的 VM"
    silent: true
    cmds:
      - |
        set -euo pipefail
        os=$(jq -r 'keys[]' custom/iso/manifest.json | gum choose --header "選擇要建立的 VM 作業系統")
        task "build:$os"

  debian:
    desc: "在 ESXi 上建立並無人值守安裝一台 Debian VM"
    silent: true
    cmds:
      - |
        set -euo pipefail
        if [ ! -f custom/.env ]; then
          echo "錯誤：找不到 custom/.env，先 cp custom/.env.example custom/.env 並填好真實值" >&2
          exit 1
        fi
        set -a
        source custom/.env
        set +a
        filename=$(jq -r '.debian["iso-path"]' custom/iso/manifest.json)
        iso_path="$(pwd)/custom/iso/$filename"
        build_path=$(jq -r '.debian["build-path"]' custom/iso/manifest.json)
        if [ ! -f "$iso_path" ]; then
          echo "錯誤：找不到 $iso_path，請先把對應的 ISO 放進 custom/iso/" >&2
          exit 1
        fi
        ansible-playbook "$build_path" --extra-vars "iso_path=${iso_path}"
