# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  default:
    desc: "互動式選擇作業系統，建立對應的 VM"
    silent: true
    cmds:
      - |
        set -euo pipefail
        os=$(jq -r 'keys[]' custom/iso/manifest.json | gum choose --header "選擇要建立的 VM 作業系統")
        task "build:$os"

  debian:
    desc: "產生 Debian VM 的所有檔案（ISO、.vmx、金鑰）並上傳到 hypervisor，註冊/開機要自己手動做"
    silent: true
    cmds:
      - |
        set -euo pipefail
        if [ ! -f custom/.env ]; then
          echo "錯誤：找不到 custom/.env，先 cp custom/.env.example custom/.env 並填好真實值" >&2
          exit 1
        fi
        set -a
        source custom/.env
        set +a
        filename=$(jq -r '.debian["iso-path"]' custom/iso/manifest.json)
        iso_path="$(pwd)/custom/iso/$filename"
        build_path=$(jq -r '.debian["build-path"]' custom/iso/manifest.json)
        if [ ! -f "$iso_path" ]; then
          echo "錯誤：找不到 $iso_path，請先把對應的 ISO 放進 custom/iso/" >&2
          exit 1
        fi

        # vm_name 要跟 playbook/control-panel/debian.yml 裡的 vm_name 保持一致——目前全專案
        # 只有這一台 VM，先硬寫；之後要支援多台 VM 的話，這個值要想辦法變成
        # 兩邊共用的單一來源，而不是分別寫死兩份。
        vm_name="debian-vm"
        preseed_iso_path="$(pwd)/custom/generated/iso/${vm_name}/${vm_name}-preseed.iso"

        # 這台 VM 一定會被設成 WireGuard server，這不是選用功能——這裡只問
        # 要新增幾個匿名的 peer 位置（金鑰先產生好，還沒被任何機器用）。
        # 「把目前這台機器認領成 peer」刻意不在這裡問、也不在這裡做——認領
        # 需要填 VM 的 Endpoint（真實 IP），但這個當下 VM 根本還沒開機，
        # 不可能知道 IP。等 VM 建好、開機、查到 IP 之後，另外跑 task add-peer。
        peer_slot_count=$(gum input --placeholder "這次要新增幾個 WireGuard peer 位置？不需要就輸入 0" --value "0")
        if ! [[ "$peer_slot_count" =~ ^[0-9]+$ ]]; then
          echo "錯誤：peer 數量必須是非負整數" >&2
          exit 1
        fi

        # ISO 重新封裝（含修改開機參數）要花時間，而且 playbook/control-panel/debian.yml
        # 裡那個 task 用 creates 判斷「本地檔案已存在就跳過」——不會管腳本
        # 或 preseed 內容有沒有變。所以在這裡先問清楚使用者的意圖：要重新
        # 封裝就先刪掉舊檔讓它重跑，不要就維持現狀（沿用舊 ISO、不再多問）。
        if [ -f "$preseed_iso_path" ]; then
          if gum confirm "已經有打包好的 ISO（$preseed_iso_path），要重新封裝嗎？（選「否」就沿用現有的舊 ISO）"; then
            rm -f "$preseed_iso_path"
          fi
        fi

        # 上傳到 datastore 那幾步（scp ISO、scp .vmx、vmkfstools 建磁碟）全部
        # 都是無條件覆蓋，所以上傳之前要先確認遠端資料夾是否已經存在過，避免
        # 在使用者沒注意到的情況下，直接把已經在用的 VM 檔案蓋掉。這裡只用
        # 純檔案系統層級的 SSH 檢查（test -d），刻意不呼叫 vim-cmd 查電源
        # 狀態——那會碰到 ESXi 的 inventory 層，不符合這個專案「完全不碰
        # ESXi 管理層 API」的設計，所以請使用者自己確認 VM 沒有在跑。
        mkdir -p custom/generated/keys/known-hosts
        export SSHPASS="$HYPERVISOR_PASSWORD"
        datastore_vm_dir="/vmfs/volumes/${HYPERVISOR_DATASTORE}/${vm_name}"
        remote_check=$(sshpass -e ssh \
          -o StrictHostKeyChecking=accept-new \
          -o UserKnownHostsFile=custom/generated/keys/known-hosts/hypervisor_known_hosts \
          "${HYPERVISOR_USERNAME}@${HYPERVISOR_HOSTNAME}" \
          "[ -d '${datastore_vm_dir}' ] && echo EXISTS || echo MISSING")
        if [ "$remote_check" = "EXISTS" ]; then
          if ! gum confirm "ESXi 上的 ${datastore_vm_dir} 已經存在，確定要覆蓋裡面的 ISO/.vmx 嗎？（如果這台 VM 現在已經 Register 且開機中，直接覆蓋可能讓它故障——請先自己確認已經 Power Off／Unregister）"; then
            echo "使用者取消，不會上傳覆蓋" >&2
            exit 1
          fi
        fi

        ansible-playbook "$build_path" --extra-vars "iso_path=${iso_path} peer_slot_count=${peer_slot_count}"

        echo "" >&2
        echo "要把這台機器加進 WireGuard、成為 peer，VM 開機、查到 IP 之後，請跑：task add-peer" >&2
