# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  ansible:
    desc: "安裝 ansible-core 與必要的 collections"
    silent: true
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y ansible
      - ansible-galaxy collection install -r requirements.yml

  iso-tools:
    desc: "安裝重新封裝 ISO（preseed 注入）所需的工具"
    silent: true
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y xorriso isolinux

  gum:
    desc: "安裝 gum（互動式選單用），走 Charm 官方 apt repo"
    silent: true
    cmds:
      - sudo mkdir -p /etc/apt/keyrings
      - sh -c "curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg"
      - sh -c 'echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list'
      - sudo apt-get update
      - sudo apt-get install -y gum

  jq:
    desc: "安裝 jq（解析 manifest.json 用）"
    silent: true
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y jq

  sshpass:
    desc: "安裝 sshpass（build 流程要非互動 SSH 進 hypervisor，用 SSHPASS 環境變數餵密碼）"
    silent: true
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y sshpass

  wireguard-tools:
    desc: "安裝 wireguard-tools（本機要用 wg genkey/genpsk 產生 WireGuard 金鑰，WSL agent 模式也要靠它建隧道）"
    silent: true
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y wireguard-tools

  go:
    desc: "安裝 Go 工具鏈（custom/scripts/vm-form/ 的互動表單用 go run 現場跑；custom/scripts/bootstrap-sudo/ 要交叉編譯成靜態執行檔塞進 ISO，兩者都在 control-panel/debian.yml 跑的時候才會用到，這裡先把依賴下載好）"
    silent: true
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y golang-go
      - |
        set -euo pipefail
        cd custom/scripts/vm-form
        go mod download
      - |
        set -euo pipefail
        cd custom/scripts/bootstrap-sudo
        go mod download

  winrm:
    desc: "安裝 pywinrm（ansible.windows collection 透過 WinRM 連 Windows 主機要用，見 inventory/windows.ini）"
    silent: true
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y python3-winrm # 連同 python3-requests-ntlm 一起裝好，對應 inventory/windows.ini 的 ansible_winrm_transport=ntlm

  default:
    desc: "安裝開發這個專案所需的所有工具"
    cmds:
      - task: ansible
      - task: iso-tools
      - task: gum
      - task: jq
      - task: sshpass
      - task: wireguard-tools
      - task: go
      - task: winrm
