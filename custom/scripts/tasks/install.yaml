# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  ansible:
    desc: "安裝 ansible-core 與必要的 collections"
    silent: true
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y ansible
      # apt 的 python3-pyvmomi 太舊（6.7.1），用的 ssl.wrap_socket 在 Python 3.12
      # 被整個移除，會讓 community.vmware 的模組直接噴 AttributeError；用 pip
      # 裝新版到使用者自己的 ~/.local，不動系統層級套件
      - pip3 install --user --break-system-packages --upgrade pyvmomi
      - ansible-galaxy collection install -r requirements.yml

  iso-tools:
    desc: "安裝重新封裝 ISO（preseed 注入）所需的工具"
    silent: true
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y xorriso isolinux

  gum:
    desc: "安裝 gum（互動式選單用），走 Charm 官方 apt repo"
    silent: true
    cmds:
      - sudo mkdir -p /etc/apt/keyrings
      - sh -c "curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg"
      - sh -c 'echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list'
      - sudo apt-get update
      - sudo apt-get install -y gum

  jq:
    desc: "安裝 jq（解析 manifest.json 用）"
    silent: true
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y jq

  default:
    desc: "安裝開發這個專案所需的所有工具"
    cmds:
      - task: ansible
      - task: iso-tools
      - task: gum
      - task: jq
