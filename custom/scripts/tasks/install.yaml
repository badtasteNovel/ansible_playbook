# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  ansible:
    desc: "安裝 ansible-core 與必要的 collections"
    silent: true
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y ansible
      - ansible-galaxy collection install -r requirements.yml

  iso-tools:
    desc: "安裝重新封裝 ISO（preseed 注入）所需的工具"
    silent: true
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y xorriso isolinux

  gum:
    desc: "安裝 gum（互動式選單用），走 Charm 官方 apt repo"
    silent: true
    cmds:
      - sudo mkdir -p /etc/apt/keyrings
      - sh -c "curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg"
      - sh -c 'echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list'
      - sudo apt-get update
      - sudo apt-get install -y gum

  jq:
    desc: "安裝 jq（解析 manifest.json 用）"
    silent: true
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y jq

  sshpass:
    desc: "安裝 sshpass（build 流程要非互動 SSH 進 hypervisor，用 SSHPASS 環境變數餵密碼）"
    silent: true
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y sshpass

  wireguard-tools:
    desc: "安裝 wireguard-tools（本機要用 wg genkey/genpsk 產生 WireGuard 金鑰，WSL agent 模式也要靠它建隧道）"
    silent: true
    cmds:
      - sudo apt-get update
      - sudo apt-get install -y wireguard-tools

  default:
    desc: "安裝開發這個專案所需的所有工具"
    cmds:
      - task: ansible
      - task: iso-tools
      - task: gum
      - task: jq
      - task: sshpass
      - task: wireguard-tools
