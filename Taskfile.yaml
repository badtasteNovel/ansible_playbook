# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

includes:
  install: ./custom/scripts/tasks/install.yaml
  verify-iso: ./custom/scripts/tasks/verify-iso.yaml
  build: ./custom/scripts/tasks/build-vm.yaml

tasks:
  select-iso:
    desc: "互動式選擇要使用的 ISO 檔案（印出選中檔案的路徑）"
    silent: true
    cmds:
      - |
        set -euo pipefail
        name=$(jq -r 'keys[]' custom/iso/manifest.json | gum choose --header "選擇要使用的 ISO")
        filename=$(jq -r --arg k "$name" '.[$k]["iso-path"]' custom/iso/manifest.json)
        iso_path="$(pwd)/custom/iso/$filename"
        if [ ! -f "$iso_path" ]; then
          echo "錯誤：找不到 $iso_path，請先把對應的 ISO 放進 custom/iso/" >&2
          exit 1
        fi
        echo "$iso_path"

  find-esxi-hostname:
    desc: "找尋 ESXi host name（SSH 進 ESXi 跑 esxcli system hostname get，查 ESXI_INVENTORY_NAME 該填的值）"
    silent: true
    cmds:
      - |
        set -euo pipefail
        if [ ! -f custom/.env ]; then
          echo "錯誤：找不到 custom/.env，先 cp custom/.env.example custom/.env 並填好真實值" >&2
          exit 1
        fi
        set -a
        source custom/.env
        set +a
        ssh "${ESXI_USERNAME}@${ESXI_HOSTNAME}" esxcli system hostname get
        echo
        echo "請把上面「Fully Qualified Domain Name」那一行的值，複製填進 custom/.env 的 ESXI_INVENTORY_NAME"
