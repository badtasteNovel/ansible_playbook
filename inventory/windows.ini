# 透過 SSH 連本機 Windows（WSL2 的場景：Ansible 跑在 WSL2 裡，要連的
# Windows 就是 WSL2 所在的那台主機本身）——原本試過 WinRM/NTLM，一路踩了
# 太多坑（NTLM loopback check 擋自己連自己、OpenSSL 3.x 預設關掉 NTLM
# 需要的 MD4、本機帳號空密碼被網路登入政策擋、網域環境下的帳號名稱解析
# 問題），改用這個專案本來就在用的 SSH 金鑰模式，跟連 ESXi hypervisor
# 的做法一致。Windows 10/11 內建 OpenSSH Server 功能，裝起來就有。
#
# 這裡不放 ansible_user/ansible_password——帳密放在 inventory/group_vars/
# windows.yml，不透過 lookup('env', ...)／OS 環境變數這一層，見
# custom/scripts/tasks/ansible/load_env.yml 開頭的說明。這個檔案本身完全
# 沒有機密內容，可以直接進版控。
#
# host 故意取名 windows_host、不要直接寫 127.0.0.1：如果這裡的 hostname
# 字面上就是 127.0.0.1，任何用 hosts: localhost 連本機（例如
# playbook/wsl/windows-ping.yml 第一個 play）的 play，會被 Ansible 判定成
# 跟這個 windows group 裡的 127.0.0.1 是同一台主機，進而也套用到
# inventory/group_vars/windows.yml 的連線變數——而那些值本來就是靠
# hosts: localhost 那個 play 才生得出來的，變成還沒產生就被拿去用，範本
# 解析直接失敗。實測驗證過這個 collision 真的會發生；用一個跟 localhost
# 無關的 hostname（windows_host），靠 ansible_host 另外指定實際連線位址，
# 就不會跟 localhost 混在一起。
#
# ansible_host 用 127.0.0.1：WSL2 mirrored 模式下連本機 Windows，連
# 127.0.0.1 會先撞到 WSL2 自己的 ip rule 把 127.0.0.0/8 都導去自己的
# local table 這個問題（跟當初 WinRM 踩到的一樣），修法是
# playbook/wsl/network.yml 裡那支 ip rule 修復腳本插的例外規則（現在比對
# 的是 port 22，不是舊版 WinRM 用的 5985）。
#
# ansible_shell_type=powershell：Ansible 透過這個連線執行指令時要用
# PowerShell 語法，不是預設的 POSIX sh——Windows 目標一律要設這個，不管
# 連線方式是 SSH 還是 WinRM。
#
# known_hosts 放在 repo 根目錄的 keys/（不是 custom/generated/keys/）：
# custom/generated/ 底下的東西概念上是「build 產物」，task clean 可以
# （要額外確認）整個清掉；這把金鑰／known_hosts 是連線身分，不是哪次
# build 的產物，刻意放在不會被 task clean 掃到的獨立位置。
[windows]
windows_host ansible_host=127.0.0.1

[windows:vars]
ansible_connection=ssh
ansible_shell_type=powershell
ansible_port=22
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=keys/known-hosts/windows_known_hosts
