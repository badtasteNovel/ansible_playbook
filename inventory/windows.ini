# 透過 WinRM 連本機 Windows（WSL2 的場景：Ansible 跑在 WSL2 裡，要連的
# Windows 就是 WSL2 所在的那台主機本身）——跟這個專案其他地方連 ESXi
# hypervisor 用的「純 SSH + scp」完全是兩回事，Windows 沒有原生 SSH 進
# 系統管理層的對應管道，WinRM 是 Ansible 官方支援 Windows 的標準做法。
#
# 這裡不放 ansible_user/ansible_password——帳密放在 inventory/group_vars/
# windows.yml（讀 custom/scripts/tasks/ansible/load_env.yml 解析出來的
# custom/.env 內容），不透過 lookup('env', ...)／OS 環境變數這一層，見該檔案
# 開頭的說明。這個檔案本身完全沒有機密內容，可以直接進版控。
#
# host 故意取名 windows_host、不要直接寫 127.0.0.1：如果這裡的 hostname
# 字面上就是 127.0.0.1，任何用 hosts: localhost 連本機（例如
# playbook/wsl/windows-ping.yml 第一個 play）的 play，會被 Ansible 判定成
# 跟這個 windows group 裡的 127.0.0.1 是同一台主機，進而也套用到
# inventory/group_vars/windows.yml 的 ansible_user/ansible_password——而
# 那兩個值本來就是靠 hosts: localhost 那個 play 才生得出來的，變成還沒
# 產生就被拿去用，範本解析直接失敗。實測驗證過這個 collision 真的會發生；
# 用一個跟 localhost 無關的 hostname（windows_host），靠 ansible_host 另外
# 指定實際連線位址，就不會跟 localhost 混在一起。
#
# ansible_winrm_transport=ntlm：WinRM 認證方式選 NTLM（Windows 本機帳號
# 最簡單能用的方式，不需要額外設定 Kerberos）。Windows 那端要先手動執行
# 過一次 Enable-PSRemoting -Force（開 WinRM listener + 對應防火牆規則），
# 這是一次性的手動管理員步驟，跟專案裡其他「某些事就是要人工做」的慣例
# 一致（見 README/CLAUDE.md 裡 Register VM／Power On 那幾步）。
#
# ansible_host 用 127.0.0.1：排查過程中一度卡在這裡（連 127.0.0.1:5985
# 跟連 WSL2 自己 eth1 的 LAN IP 192.168.0.65 症狀一樣，都是立刻 connection
# refused——WSL2 把兩者都判定成「這是打給我自己」），試過幾個方向都沒用，
# 最後找到的真正根因是 `ip rule` 裡一條 blanket 規則（`to 127.0.0.0/8
# lookup local`）把所有 127.0.0.0/8 流量都鎖進 WSL2 自己的 local table，
# 修法是插一條更精確的例外規則，見 playbook/wsl/network.yml 的
# ansible-wsl-network-fix.sh。這個例外規則只精確比對「目的地剛好是
# 127.0.0.1」，不包含 192.168.0.65（那個是 DHCP 配的 LAN IP，本來就不該
# 寫死在這裡）——所以這裡要用 127.0.0.1，不能用 LAN IP，兩者在修好之前
# 症狀一樣，但只有 127.0.0.1 有對應的例外規則覆蓋。
[windows]
windows_host ansible_host=127.0.0.1

[windows:vars]
ansible_connection=winrm
ansible_port=5985
ansible_winrm_transport=ntlm
