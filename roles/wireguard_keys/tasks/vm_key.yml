---
# 只產生 VM 自己的 WireGuard 金鑰對，跟 peer 金鑰完全分開——VM 一定需要自己
# 的身分，不管現在有沒有任何 peer 存在；peer 金鑰的產生/數量是完全獨立的事，
# 見 generate_one_peer_slot.yml/claim_peer.yml。playbook/control-panel/debian.yml
# 跟 playbook/wsl/add-peer.yml 都會呼叫這個檔案（add-peer.yml 需要先知道 VM
# 的公鑰才能組出自己的 wg0.conf，即使 control-panel 還沒跑過也一樣）——
# idempotent，不管哪邊先跑都行。
#
# 金鑰檔名用 {{ vm_name }} 當前綴——呼叫前，呼叫端要讓 vm_name 這個變數在
# 當下的範圍內看得到（兩個呼叫端都已經把它列為必填的 play 層級變數）。

- name: 確保 {{ wireguard_keys_dir }} 存在
  ansible.builtin.file:
    path: "{{ wireguard_keys_dir }}"
    state: directory
    mode: "0700"

- name: 產生 VM 自己的 WireGuard 金鑰對（若已存在則不重建）
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    wg genkey | tee {{ wireguard_keys_dir }}/{{ vm_name }}_wireguard | wg pubkey > {{ wireguard_keys_dir }}/{{ vm_name }}_wireguard.pub
  args:
    executable: /bin/bash # /bin/sh（dash）不支援 pipefail，這裡用到 wg genkey | tee | wg pubkey 的管線，一定要 bash
    creates: "{{ wireguard_keys_dir }}/{{ vm_name }}_wireguard"
